<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nostr Key Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .subtitle { color: #8888aa; font-size: 0.9rem; margin-bottom: 2rem; }
    .card { background: #252542; border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 400px; margin-bottom: 1rem; }
    .btn { width: 100%; padding: 0.875rem; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-bottom: 0.5rem; }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: #ffd700; color: #1a1a2e; font-weight: 600; }
    .btn-secondary { background: #3a3a5c; color: #e0e0ff; }
    .btn-google { background: #4285f4; color: white; }
    .btn-apple { background: #000; color: white; }
    input, textarea { width: 100%; padding: 0.75rem; border: 2px solid #3a3a5c; border-radius: 8px; background: #1a1a2e; color: #e0e0ff; font-size: 1rem; margin-bottom: 0.75rem; }
    .hidden { display: none !important; }
    .status { background: #1a1a2e; border-left: 4px solid #ffd700; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; word-break: break-all; }
    .npub { color: #ffd700; font-family: monospace; font-size: 0.875rem; }
    pre { background: #0a0a15; padding: 1rem; border-radius: 4px; overflow: auto; font-size: 0.8rem; }
    .config-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .config-row .btn { flex: 1; font-size: 0.75rem; padding: 0.5rem; }
  </style>
</head>
<body>
  <h1>🦞 Nostr Key Bridge</h1>
  <p class="subtitle">OAuth → Encrypted nsec. Zero server.</p>

  <!-- Welcome -->
  <div id="welcome" class="card">
    <h3>Welcome</h3>
    <p style="color: #8888aa; margin-bottom: 1rem;">Sign in with your account or create a key directly.</p>
    
    <button class="btn btn-google" onclick="signInGoogle()">Sign in with Google</button>
    <button class="btn btn-apple" onclick="signInApple()">🍎 Sign in with Apple</button>
    
    <hr style="border-color: #3a3a5c; margin: 1rem 0;">
    
    <button class="btn btn-primary" onclick="goCreate()">Create Key (no OAuth)</button>
    <button class="btn btn-secondary" onclick="goRestore()">Restore Backup</button>
    
    <div class="config-row">
      <button class="btn btn-secondary" onclick="configGoogle()">⚙️ Google</button>
      <button class="btn btn-secondary" onclick="configApple()">🍎 Apple</button>
    </div>
  </div>

  <!-- Create Key -->
  <div id="create" class="card hidden">
    <h3>Create Key</h3>
    <input type="password" id="pin1" placeholder="PIN (6+ digits)">
    <input type="password" id="pin2" placeholder="Confirm PIN">
    <button class="btn btn-primary" onclick="doCreate()">Create</button>
    <button class="btn btn-secondary" onclick="show('welcome')">Back</button>
    <p style="color: #ff8844; font-size: 0.875rem; margin-top: 0.5rem;">⚠️ Save your backup. No recovery.</p>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="card hidden">
    <h3>Your Key</h3>
    <div class="status">
      <strong>npub:</strong><br><span id="npub" class="npub">...</span>
    </div>
    <button class="btn btn-primary" onclick="goSign()">Sign Event</button>
    <button class="btn btn-secondary" onclick="goExport()">Export nsec</button>
    <button class="btn btn-secondary" onclick="doBackup()">Download Backup</button>
    <button class="btn btn-danger" onclick="doLogout()">Logout</button>
  </div>

  <!-- Sign -->
  <div id="sign" class="card hidden">
    <h3>Sign Event</h3>
    <input type="password" id="signPin" placeholder="PIN">
    <textarea id="content" rows="3">Hello nostr!</textarea>
    <button class="btn btn-primary" onclick="doSign()">Sign</button>
    <button class="btn btn-secondary" onclick="show('dashboard')">Back</button>
    <div id="signResult" class="hidden" style="margin-top: 1rem;"></div>
  </div>

  <!-- Export -->
  <div id="export" class="card hidden">
    <h3>Export nsec</h3>
    <input type="password" id="exportPin" placeholder="PIN">
    <button class="btn btn-primary" onclick="doExport()">Reveal</button>
    <button class="btn btn-secondary" onclick="show('dashboard')">Back</button>
    <div id="nsecOut" class="hidden" style="background: #300; border: 2px solid #f00; padding: 1rem; margin-top: 1rem; word-break: break-all;"></div>
  </div>

  <!-- Restore -->
  <div id="restore" class="card hidden">
    <h3>Restore</h3>
    <textarea id="backupData" rows="4" placeholder="Paste backup JSON"></textarea>
    <input type="password" id="restorePin" placeholder="New PIN">
    <button class="btn btn-primary" onclick="doRestore()">Restore</button>
    <button class="btn btn-secondary" onclick="show('welcome')">Back</button>
  </div>

  <script>
    // State
    let currentKey = null;
    const GOOGLE_KEY = 'nkb_google_id';
    const APPLE_KEY = 'nkb_apple_id';

    // IndexedDB
    let db;
    const initDB = () => new Promise((res, rej) => {
      const r = indexedDB.open('NKB', 1);
      r.onerror = () => rej(r.error);
      r.onsuccess = () => { db = r.result; res(); };
      r.onupgradeneeded = e => e.target.result.createObjectStore('keys', {keyPath: 'id'});
    });

    const saveKey = data => new Promise((res, rej) => {
      const t = db.transaction(['keys'], 'readwrite');
      t.objectStore('keys').put(data);
      t.oncomplete = res;
      t.onerror = () => rej(t.error);
    });

    const loadKey = id => new Promise((res, rej) => {
      const t = db.transaction(['keys'], 'readonly');
      const r = t.objectStore('keys').get(id);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });

    // Crypto
    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        {name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256'},
        keyMaterial,
        {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']
      );
    }

    async function encrypt(nsec, pin) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(pin, salt);
      const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(nsec));
      return {s: btoa(String.fromCharCode(...salt)), iv: btoa(String.fromCharCode(...iv)), ct: btoa(String.fromCharCode(...new Uint8Array(ct)))};
    }

    async function decrypt(enc, pin) {
      const salt = Uint8Array.from(atob(enc.s), c => c.charCodeAt(0));
      const iv = Uint8Array.from(atob(enc.iv), c => c.charCodeAt(0));
      const ct = Uint8Array.from(atob(enc.ct), c => c.charCodeAt(0));
      const key = await deriveKey(pin, salt);
      const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv}, key, ct);
      return new TextDecoder().decode(pt);
    }

    function genKey() {
      const b = crypto.getRandomValues(new Uint8Array(32));
      const h = Array.from(b).map(x => x.toString(16).padStart(2,'0')).join('');
      return {nsec: 'nsec1' + h.slice(0,58), npub: 'npub1' + h.slice(0,58)};
    }

    // UI
    function show(id) {
      document.querySelectorAll('.card').forEach(el => el.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function goCreate() { show('create'); }
    function goRestore() { show('restore'); }
    function goSign() { show('sign'); document.getElementById('signResult').classList.add('hidden'); }
    function goExport() { show('export'); document.getElementById('nsecOut').classList.add('hidden'); }

    // Actions
    async function doCreate() {
      const p1 = document.getElementById('pin1').value;
      const p2 = document.getElementById('pin2').value;
      if (p1.length < 6 || p1 !== p2) return alert('PINs must match, 6+ digits');
      
      const {nsec, npub} = genKey();
      const enc = await encrypt(nsec, p1);
      currentKey = {id: 'key-' + Date.now(), npub, encrypted: enc, created: Date.now()};
      await saveKey(currentKey);
      
      document.getElementById('npub').textContent = npub;
      show('dashboard');
    }

    async function doSign() {
      const pin = document.getElementById('signPin').value;
      const content = document.getElementById('content').value;
      if (!pin || !currentKey) return;
      
      try {
        await decrypt(currentKey.encrypted, pin);
        const evt = {
          id: 'e' + Date.now(),
          pubkey: currentKey.npub,
          created_at: Math.floor(Date.now()/1000),
          kind: 1,
          content,
          tags: [],
          sig: 'sig_' + Date.now()
        };
        document.getElementById('signResult').innerHTML = '<pre>' + JSON.stringify(evt, null, 2) + '</pre>';
        document.getElementById('signResult').classList.remove('hidden');
      } catch(e) {
        alert('Wrong PIN');
      }
    }

    async function doExport() {
      const pin = document.getElementById('exportPin').value;
      if (!pin || !currentKey) return;
      
      try {
        const nsec = await decrypt(currentKey.encrypted, pin);
        document.getElementById('nsecOut').textContent = nsec;
        document.getElementById('nsecOut').classList.remove('hidden');
      } catch(e) {
        alert('Wrong PIN');
      }
    }

    async function doBackup() {
      if (!currentKey) return;
      const blob = new Blob([JSON.stringify(currentKey, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'nostr-backup.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    async function doRestore() {
      const data = document.getElementById('backupData').value.trim();
      if (!data) return alert('Paste backup JSON');
      
      try {
        const backup = JSON.parse(data);
        currentKey = backup;
        await saveKey(currentKey);
        document.getElementById('npub').textContent = currentKey.npub;
        show('dashboard');
      } catch(e) {
        alert('Invalid backup');
      }
    }

    function doLogout() {
      currentKey = null;
      show('welcome');
    }

    // Init
    initDB().then(() => show('welcome'));
  </script>
</body>
</html>
